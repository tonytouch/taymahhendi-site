<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Fear No Evil — new music from Taymah Hendi. Out December 11, 2026.">
  <title>Fear No Evil — Taymah Hendi</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --white: #f5f3ef;
      --muted: #96938e;
      --rule: rgba(245, 243, 239, .16);
      --page-width: 1080px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { background: var(--black); }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--black);
      color: var(--white);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100% - 48px, var(--page-width));
      margin-inline: auto;
      padding: clamp(32px, 7vh, 76px) 0 0;
    }

    .release {
      width: min(100%, 720px);
      margin: 0 auto;
      text-align: center;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      background: #0d0e10;
      box-shadow: 0 28px 90px rgba(0, 0, 0, .42);
    }

    .release-date {
      margin: 25px 0 0;
      color: #fff;
      font-size: clamp(.78rem, 1.1vw, .94rem);
      font-weight: 500;
      letter-spacing: .24em;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .manifesto {
      width: min(100%, 720px);
      min-height: 260px;
      margin: clamp(68px, 12vh, 120px) auto 0;
      padding: 28px 0 96px;
      border-top: 1px solid var(--rule);
      text-align: center;
    }

    .manifesto-kicker {
      margin: 0;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .28em;
      line-height: 1.7;
      text-transform: uppercase;
    }

    .manifesto h2 {
      margin: 14px 0 0;
      color: var(--white);
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(2.3rem, 5.5vw, 4.2rem);
      font-weight: 400;
      letter-spacing: .09em;
      line-height: 1.05;
    }

    .manifesto-space {
      height: clamp(96px, 20vh, 180px);
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 32px, var(--page-width));
        padding-top: 24px;
      }

      .cover { box-shadow: 0 18px 54px rgba(0, 0, 0, .38); }
      .release-date { margin-top: 18px; letter-spacing: .2em; }
      .manifesto { margin-top: 68px; padding-top: 23px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="release" aria-label="Fear No Evil release">
      <h1 hidden>Fear No Evil — Taymah Hendi</h1>
      <img
        class="cover"
        src="assets/IMG_2378.JPG"
        alt="Fear No Evil single artwork by Taymah Hendi"
        width="1600"
        height="2000"
        fetchpriority="high"
      >
      <p class="release-date">Out December 11, 2026</p>
    </section>

    <section class="manifesto" aria-labelledby="manifesto-title">
      <p class="manifesto-kicker">Manifesto / Introduction</p>
      <h2 id="manifesto-title">UNTAYMAHBLE</h2>
      <div class="manifesto-space" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
